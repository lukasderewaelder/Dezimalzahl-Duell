<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dezimal-Duell: Space Mission</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            background-color: #0f172a;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 2px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 3px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
            color: white;
            overflow-x: hidden;
        }

        .orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(148, 163, 184, 0.2);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.1);
        }

        .number-display {
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
            transition: all 0.3s ease;
        }

        .operator-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .operator-btn:hover:not(:disabled) {
            transform: scale(1.1);
            box-shadow: 0 0 15px currentColor;
        }

        .operator-btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        /* Sort Cards */
        .sort-card {
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }
        .sort-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px -5px rgba(56, 189, 248, 0.4);
            border-color: #38bdf8;
        }
        .sort-card.selected {
            opacity: 0;
            pointer-events: none;
        }
        
        .slot-card {
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .slot-card:hover {
            border-color: #f472b6;
        }

        /* Animation für richtige Antwort */
        @keyframes successPulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(74, 222, 128, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
        }

        .animate-success {
            animation: successPulse 0.8s ease-out;
            border-color: #4ade80 !important;
            background-color: rgba(74, 222, 128, 0.1);
        }

        .animate-error {
            border-color: #f87171 !important;
            background-color: rgba(248, 113, 113, 0.1);
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* Stellrad Design */
        .difficulty-selector input[type="radio"], .mode-selector input[type="radio"] {
            display: none;
        }

        .difficulty-selector label, .mode-selector label {
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .difficulty-selector input:checked + label {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
            transform: translateY(-2px);
        }

        .mode-selector input:checked + label {
            background: #0ea5e9; /* Sky 500 */
            color: white;
            box-shadow: 0 0 10px rgba(14, 165, 233, 0.5);
        }
        
        .mode-selector label:hover {
            background: rgba(255,255,255,0.1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Header Area -->
    <header class="text-center mb-6">
        <h1 class="orbitron text-3xl md:text-5xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-purple-500 mb-2">
            Dezimal Duell
        </h1>
        <p class="text-slate-400 text-lg">Mission: Mathe im Weltraum 🚀</p>
    </header>

    <!-- Main Game Panel -->
    <main class="glass-panel rounded-3xl p-6 md:p-8 w-full max-w-4xl relative overflow-hidden flex flex-col min-h-[600px]">
        
        <!-- Mode Tabs -->
        <div class="flex justify-center mb-6 border-b border-slate-700 pb-4">
            <div class="mode-selector bg-slate-800 p-1 rounded-lg inline-flex gap-1">
                <input type="radio" name="gamemode" id="modeCompare" value="compare" checked onchange="switchMode('compare')">
                <label for="modeCompare" class="px-6 py-2 rounded-md text-sm font-bold text-slate-400">
                    ⚔️ Duell (Vergleich)
                </label>

                <input type="radio" name="gamemode" id="modeSort" value="sort" onchange="switchMode('sort')">
                <label for="modeSort" class="px-6 py-2 rounded-md text-sm font-bold text-slate-400">
                    🔢 Ordnung (Sortieren)
                </label>
            </div>
        </div>

        <!-- Difficulty Selector (Shared) -->
        <div class="flex justify-center mb-8">
            <div class="difficulty-selector bg-slate-800 p-1.5 rounded-full inline-flex relative shadow-inner flex-wrap justify-center gap-2">
                
                <input type="radio" name="difficulty" id="lvl1" value="1" checked onchange="setDifficulty(1)">
                <label for="lvl1" class="px-4 py-2 rounded-full text-xs md:text-sm font-bold text-slate-400 hover:text-white">
                    ⭐ Kadett
                </label>

                <input type="radio" name="difficulty" id="lvl2" value="2" onchange="setDifficulty(2)">
                <label for="lvl2" class="px-4 py-2 rounded-full text-xs md:text-sm font-bold text-slate-400 hover:text-white">
                    🚀 Pilot
                </label>

                <input type="radio" name="difficulty" id="lvl3" value="3" onchange="setDifficulty(3)">
                <label for="lvl3" class="px-4 py-2 rounded-full text-xs md:text-sm font-bold text-slate-400 hover:text-white">
                    👽 Commander
                </label>
            </div>
        </div>

        <!-- GAME AREA: COMPARE -->
        <div id="gameAreaCompare" class="flex-grow flex flex-col justify-center">
            <div class="flex flex-col md:flex-row items-center justify-between gap-8 mb-8">
                <!-- Number A -->
                <div id="cardA" class="glass-panel w-full md:w-1/3 p-6 rounded-2xl text-center border-slate-700">
                    <div class="text-xs uppercase tracking-widest text-cyan-400 mb-2 font-bold">Zahl A</div>
                    <div id="numA" class="number-display text-4xl md:text-5xl font-bold text-white tracking-wider truncate">0,00</div>
                </div>

                <!-- Operator Buttons -->
                <div class="flex flex-row md:flex-col gap-4 w-full md:w-auto justify-center z-10">
                    <button onclick="checkCompareAnswer('<')" id="btnLess" class="operator-btn w-16 h-16 rounded-xl bg-slate-800 border-2 border-slate-600 text-3xl font-bold text-white hover:border-cyan-400 hover:text-cyan-400 flex items-center justify-center">&lt;</button>
                    <button onclick="checkCompareAnswer('=')" id="btnEqual" class="operator-btn w-16 h-16 rounded-xl bg-slate-800 border-2 border-slate-600 text-3xl font-bold text-white hover:border-purple-400 hover:text-purple-400 flex items-center justify-center">=</button>
                    <button onclick="checkCompareAnswer('>')" id="btnGreater" class="operator-btn w-16 h-16 rounded-xl bg-slate-800 border-2 border-slate-600 text-3xl font-bold text-white hover:border-pink-400 hover:text-pink-400 flex items-center justify-center">&gt;</button>
                </div>

                <!-- Number B -->
                <div id="cardB" class="glass-panel w-full md:w-1/3 p-6 rounded-2xl text-center border-slate-700">
                    <div class="text-xs uppercase tracking-widest text-pink-400 mb-2 font-bold">Zahl B</div>
                    <div id="numB" class="number-display text-4xl md:text-5xl font-bold text-white tracking-wider truncate">0,00</div>
                </div>
            </div>
        </div>

        <!-- GAME AREA: SORT -->
        <div id="gameAreaSort" class="hidden flex-grow flex flex-col justify-start">
            <div id="sortInstruction" class="text-center text-xl md:text-2xl font-bold text-cyan-300 mb-6 bg-slate-800/50 py-2 rounded-lg border border-slate-700">
                Sortiere: <span id="sortDirectionText" class="text-white">Klein ➔ Groß</span>
            </div>

            <!-- Target Slots (Where numbers go) -->
            <div class="flex justify-between gap-2 md:gap-4 mb-8">
                <div class="flex flex-col items-center w-1/4">
                    <span class="text-xs text-slate-500 mb-1 font-bold">1. Start</span>
                    <div id="slot0" onclick="returnToPool(0)" class="w-full aspect-square md:aspect-[4/3] bg-slate-800/50 border-2 border-dashed border-slate-600 rounded-xl flex items-center justify-center text-slate-600 text-lg md:text-2xl font-bold hover:bg-slate-800 transition-colors"></div>
                </div>
                <div class="flex flex-col items-center w-1/4">
                    <span class="text-xs text-slate-500 mb-1 font-bold">2.</span>
                    <div id="slot1" onclick="returnToPool(1)" class="w-full aspect-square md:aspect-[4/3] bg-slate-800/50 border-2 border-dashed border-slate-600 rounded-xl flex items-center justify-center text-slate-600 text-lg md:text-2xl font-bold hover:bg-slate-800 transition-colors"></div>
                </div>
                <div class="flex flex-col items-center w-1/4">
                    <span class="text-xs text-slate-500 mb-1 font-bold">3.</span>
                    <div id="slot2" onclick="returnToPool(2)" class="w-full aspect-square md:aspect-[4/3] bg-slate-800/50 border-2 border-dashed border-slate-600 rounded-xl flex items-center justify-center text-slate-600 text-lg md:text-2xl font-bold hover:bg-slate-800 transition-colors"></div>
                </div>
                <div class="flex flex-col items-center w-1/4">
                    <span class="text-xs text-slate-500 mb-1 font-bold">4. Ziel</span>
                    <div id="slot3" onclick="returnToPool(3)" class="w-full aspect-square md:aspect-[4/3] bg-slate-800/50 border-2 border-dashed border-slate-600 rounded-xl flex items-center justify-center text-slate-600 text-lg md:text-2xl font-bold hover:bg-slate-800 transition-colors"></div>
                </div>
            </div>

            <!-- Source Pool (Draggable items basically) -->
            <div id="sortPool" class="grid grid-cols-2 md:grid-cols-4 gap-4 p-4 bg-slate-900/40 rounded-2xl border border-slate-800">
                <!-- Generated Buttons will go here -->
            </div>
            
            <div class="text-center mt-4 text-xs text-slate-500">
                Klicke die Zahlen in der richtigen Reihenfolge an!
            </div>
        </div>

        <!-- Feedback & Shared Controls -->
        <div class="mt-auto">
            <div id="feedbackArea" class="h-12 text-center mb-6 font-bold text-xl min-h-[3rem] flex items-center justify-center">
                <span class="text-slate-500">Wähle die Lösung!</span>
            </div>

            <!-- Action Buttons -->
            <div class="flex gap-4 justify-center pt-4 border-t border-slate-700">
                <button onclick="showSolution()" class="px-6 py-3 rounded-xl bg-slate-700 hover:bg-slate-600 text-white font-bold transition-colors flex items-center gap-2 border border-slate-600">
                    <span>💡</span> Lösung
                </button>
                <button onclick="generateTask()" class="px-8 py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold shadow-lg shadow-cyan-500/20 transition-all transform hover:-translate-y-1 flex items-center gap-2">
                    <span>🎲</span> Neue Aufgabe
                </button>
            </div>
        </div>

    </main>

    <!-- Decoration -->
    <div class="fixed top-10 left-10 text-6xl opacity-20 pointer-events-none animate-pulse">🪐</div>
    <div class="fixed bottom-10 right-10 text-6xl opacity-20 pointer-events-none animate-bounce">🛸</div>

    <script>
        // --- GLOBAL STATE ---
        let currentMode = 'compare'; // 'compare' or 'sort'
        let difficulty = 1;
        let isSolved = false;

        // Compare Mode State
        let compA = { val: 0, str: "" };
        let compB = { val: 0, str: "" };

        // Sort Mode State
        let sortNumbers = []; // Array of objects {val, str, id}
        let sortDirection = 'asc'; // 'asc' or 'desc'
        let slotsContent = [null, null, null, null]; // Stores the objects currently in slots 0-3

        // --- CORE FUNCTIONS ---

        function switchMode(mode) {
            currentMode = mode;
            
            // Toggle UI visibility
            const areaCompare = document.getElementById('gameAreaCompare');
            const areaSort = document.getElementById('gameAreaSort');

            if (mode === 'compare') {
                areaCompare.classList.remove('hidden');
                areaSort.classList.add('hidden');
            } else {
                areaCompare.classList.add('hidden');
                areaSort.classList.remove('hidden');
                areaSort.classList.add('flex'); 
            }
            
            generateTask();
        }

        function setDifficulty(level) {
            difficulty = level;
            generateTask();
        }

        function generateTask() {
            isSolved = false;
            resetUI();
            
            if (currentMode === 'compare') {
                generateCompareTask();
            } else {
                generateSortTask();
            }
        }

        function resetUI() {
            document.getElementById('feedbackArea').innerHTML = '<span class="text-slate-500">Löse die Mission!</span>';
            
            // Reset Compare UI
            const cards = document.querySelectorAll('.glass-panel');
            cards.forEach(c => c.classList.remove('animate-success', 'animate-error'));
            resetBtnStyles();

            // Reset Sort UI
            const slots = [0,1,2,3];
            slots.forEach(i => {
                const el = document.getElementById(`slot${i}`);
                el.innerHTML = '';
                el.classList.remove('border-green-500', 'bg-green-500/20', 'border-red-500', 'bg-red-500/20');
                el.className = "w-full aspect-square md:aspect-[4/3] bg-slate-800/50 border-2 border-dashed border-slate-600 rounded-xl flex items-center justify-center text-slate-600 text-lg md:text-2xl font-bold hover:bg-slate-800 transition-colors cursor-pointer";
            });
            slotsContent = [null, null, null, null];
        }

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        // Returns string limited to max 6 chars (including comma)
        function formatNumberStrict(valStr) {
            if (valStr.length > 6) {
                return valStr.substring(0, 6);
            }
            return valStr;
        }

        // --- DIDACTIC LOGIC: COMPARE MODE ---

        function generateCompareTask() {
            // Didactic Config: Max Chars is STRICTLY 6.
            // Level 1: Mostly Tens/Ones, simple decimals.
            // Level 2: Often same integer part, check tenths/hundredths.
            // Level 3: "Trick" questions (short number > long number), or very close numbers.

            const isTargetEqual = Math.random() < 0.20;

            if (isTargetEqual) {
                generateEqualPair();
            } else {
                generateUnequalPair();
            }

            // Render
            document.getElementById('numA').textContent = compA.str;
            document.getElementById('numB').textContent = compB.str;
        }

        function generateEqualPair() {
            // Base Value
            let intPart = getRandomInt(0, 9); // Keep Int small to allow decimals
            if (difficulty > 1) intPart = getRandomInt(0, 99);
            
            let decVal = getRandomInt(1, 9);
            let val = parseFloat(intPart + "." + decVal);

            compA.val = val;
            compB.val = val;

            // Strategy: Visual difference by trailing zeros
            // Limit strict: max 6 chars. 
            // ex: "12,5" (4 chars) vs "12,50" (5 chars)
            
            let sA = val.toString();
            let sB = val.toString();

            // Make B look different
            if (sB.length < 5) {
                sB += "0";
            } else if (sB.length < 6) {
                // If we still have space
                sB += "0";
            }
            
            // Randomly swap A and B strings visually (values stay same)
            if (Math.random() > 0.5) {
                let temp = sA; sA = sB; sB = temp;
            }

            // Formatting
            // Ensure strictly max 6 chars
            sA = sA.substring(0,6);
            sB = sB.substring(0,6);

            // Special case for integers to make them decimal
            if (!sA.includes('.')) sA += ",0";
            else sA = sA.replace('.', ',');

            if (!sB.includes('.')) sB += ",00"; // might get truncated
            else sB = sB.replace('.', ',');
            
            // Final truncation check
            compA.str = sA.substring(0,6).replace(/\.$/, ""); // remove trailing dot if cutoff
            compB.str = sB.substring(0,6).replace(/\.$/, "");
        }

        function generateUnequalPair() {
            // Strategy Selection
            let strategy = "random";
            const roll = Math.random();

            if (difficulty === 1) {
                // 50% Different Integers (Easy), 50% Same Int different tenths
                strategy = roll > 0.5 ? "diffInt" : "easyDec";
            } else if (difficulty === 2) {
                // 30% Diff Int, 70% Same Int (tenths/hundredths)
                strategy = roll > 0.3 ? "mediumDec" : "diffInt";
            } else {
                // Level 3: 40% Trick (Length mismatch), 40% Same Int (High Precision), 20% Random
                if (roll < 0.4) strategy = "trickLength";
                else if (roll < 0.8) strategy = "hardDec";
                else strategy = "mediumDec";
            }

            let valA, valB, sA, sB;

            if (strategy === "diffInt") {
                // Completely different numbers
                let intA = getRandomInt(0, 99);
                let intB = getRandomInt(0, 99);
                while(intA === intB) intB = getRandomInt(0, 99);
                
                // Add simple decimals
                valA = intA + getRandomInt(1,9)/10;
                valB = intB + getRandomInt(1,9)/10;

            } else if (strategy === "easyDec") {
                // Same Integer, different tenths (can be wide apart)
                let intPart = getRandomInt(0, 19);
                let decA = getRandomInt(1, 9);
                let decB = getRandomInt(1, 9);
                while (decA === decB) decB = getRandomInt(1, 9);
                
                valA = parseFloat(intPart + "." + decA);
                valB = parseFloat(intPart + "." + decB);

            } else if (strategy === "mediumDec") {
                // Same Integer, hundredths.
                // Allow broader difference (e.g. .15 vs .80) not just neighbors
                let intPart = getRandomInt(0, 19);
                let decA = getRandomInt(10, 99);
                let decB = getRandomInt(10, 99);
                // Ensure they aren't equal or too close to essentially be equal due to floats
                while (Math.abs(decA - decB) < 1) decB = getRandomInt(10, 99);
                
                valA = parseFloat(intPart + "." + decA);
                valB = parseFloat(intPart + "." + decB);

            } else if (strategy === "hardDec") {
                // Same Integer, thousandths or close hundredths
                // Difference can be > 1 unit.
                let intPart = getRandomInt(0, 9);
                let decA = getRandomInt(100, 800);
                
                // New logic: Allow difference of +/- 1 to 50
                let diff = getRandomInt(1, 50) * (Math.random() > 0.5 ? 1 : -1);
                let decB = decA + diff;
                
                valA = parseFloat(intPart + "." + decA);
                valB = parseFloat(intPart + "." + decB);

            } else if (strategy === "trickLength") {
                // Didactic Trap: Shorter number is bigger (e.g. 0.5 vs 0.455)
                // OR Longer number is bigger but starts smaller (e.g. 0.3 vs 0.31)
                
                let intPart = getRandomInt(0, 9);
                let base = getRandomInt(2, 8); // digit 2-8
                
                // Number A: Short (e.g. X.5)
                valA = parseFloat(intPart + "." + base);
                
                // Number B: Long but smaller value (e.g. X.4...)
                // Create B by taking (base-1) and appending randoms
                // OLD: (base-1) + "99" (Strict close)
                // NEW: (base-1) + random(00-99) (Can be wide)
                let suffix = getRandomInt(10, 99);
                let decBStr = (base - 1) + "" + suffix;
                
                valB = parseFloat(intPart + "." + decBStr);

                // Randomly swap so A isn't always the short one
                if (Math.random() > 0.5) {
                    let temp = valA; valA = valB; valB = temp;
                }

            } else {
                // Fallback
                valA = getRandomInt(0,10) + Math.random();
                valB = getRandomInt(0,10) + Math.random();
            }

            // Final safety parsing and formatting strict 6 chars
            // Ensure we don't have super long float artifacts
            valA = parseFloat(valA.toFixed(4));
            valB = parseFloat(valB.toFixed(4));
            
            // Re-check equality after rounding (rare)
            if (valA === valB) valB += 0.01;

            compA.val = valA;
            compB.val = valB;

            sA = valA.toString();
            sB = valB.toString();

            // Formatting
            compA.str = sA.replace('.', ',').substring(0,6);
            compB.str = sB.replace('.', ',').substring(0,6);
            
            // If truncation made them equal string-wise (e.g. 0.12345 vs 0.12346 -> 0.1234), fix it
            if (compA.str === compB.str) {
                // Modify B visual slightly
                let lastChar = compB.str.slice(-1);
                let newLast = (parseInt(lastChar) + 2) % 10; // +2 to ensure diff
                if (isNaN(newLast)) newLast = 1;
                compB.str = compB.str.slice(0, -1) + newLast;
                compB.val = parseFloat(compB.str.replace(',', '.')); 
            }
        }

        function checkCompareAnswer(operator) {
            if (isSolved) return;

            // Re-evaluate truth based on displayed strings to be fair
            // (In case truncation changed the effective number)
            // But we try to keep val synced.
            
            let valA = compA.val;
            let valB = compB.val;

            let correctOp = '';
            if (valA < valB) correctOp = '<';
            else if (valA > valB) correctOp = '>';
            else correctOp = '=';

            const feedback = document.getElementById('feedbackArea');
            const cardA = document.getElementById('cardA');
            const cardB = document.getElementById('cardB');

            resetBtnStyles();

            if (operator === correctOp) {
                feedback.innerHTML = `<span class="text-green-400 drop-shadow-lg">Richtig! Klasse gemacht! 🎉</span>`;
                highlightButton(correctOp, 'bg-green-500', 'border-green-400');
                cardA.classList.add('animate-success');
                cardB.classList.add('animate-success');
                isSolved = true;
            } else {
                feedback.innerHTML = `<span class="text-red-400 drop-shadow-lg">Nicht ganz... schau genau auf die Stellen! 🤔</span>`;
                highlightButton(operator, 'bg-red-500', 'border-red-400');
                cardA.classList.add('animate-error');
                cardB.classList.add('animate-error');
                setTimeout(() => {
                    cardA.classList.remove('animate-error');
                    cardB.classList.remove('animate-error');
                }, 500);
            }
        }

        function resetBtnStyles() {
            const btns = ['btnLess', 'btnEqual', 'btnGreater'];
            btns.forEach(id => {
                const btn = document.getElementById(id);
                btn.className = "operator-btn w-16 h-16 rounded-xl bg-slate-800 border-2 border-slate-600 text-3xl font-bold text-white hover:border-cyan-400 hover:text-cyan-400 flex items-center justify-center";
            });
        }

        function highlightButton(op, bgClass, borderClass) {
            let btnId = '';
            if (op === '<') btnId = 'btnLess';
            if (op === '=') btnId = 'btnEqual';
            if (op === '>') btnId = 'btnGreater';
            const btn = document.getElementById(btnId);
            if(btn) {
                btn.classList.remove('bg-slate-800', 'border-slate-600');
                btn.classList.add(bgClass, borderClass, 'text-white', 'scale-110');
            }
        }

        // --- DIDACTIC LOGIC: SORT MODE ---

        function generateSortTask() {
            sortDirection = Math.random() > 0.5 ? 'asc' : 'desc';
            document.getElementById('sortDirectionText').textContent = 
                sortDirection === 'asc' ? "Klein ➔ Groß" : "Groß ➔ Klein";

            // Difficulty logic for Sort
            // Level 1: Distinct Integers or Tenths (e.g. 1.2, 3.4, 0.5, 2.2)
            // Level 2: Same Integer, diff decimals (e.g. 1.2, 1.05, 1.8, 1.33)
            // Level 3: Mixed lengths and close values (e.g. 0.5, 0.55, 0.45, 0.505)

            let strategy = difficulty === 1 ? "mixed" : (difficulty === 2 ? "sameInt" : "dense");
            
            sortNumbers = [];
            let safetyCounter = 0;

            // Base Generator
            let baseInt = getRandomInt(0, 9);
            
            while(sortNumbers.length < 4 && safetyCounter < 100) {
                safetyCounter++;
                let val;

                if (strategy === "mixed") {
                    // Random numbers
                    val = getRandomInt(0, 10) + getRandomInt(0,9)/10;
                    if (Math.random() > 0.7) val += getRandomInt(1,9)/100;
                } else if (strategy === "sameInt") {
                    // Fix Integer part
                    let dec = getRandomInt(1, 99);
                    val = parseFloat(baseInt + "." + dec);
                } else {
                    // Dense/Hard
                    // Generate around a pivot e.g. 0.5
                    // 0.5, 0.49, 0.51, 0.505
                    let decStart = getRandomInt(1, 8); // tenth
                    let variation = getRandomInt(0, 99); // hundredth/thousandth
                    val = parseFloat(baseInt + "." + decStart + variation);
                    // Ensure shorter variations exist
                    if (Math.random() > 0.5) val = parseFloat(baseInt + "." + decStart + getRandomInt(1,9));
                }

                // Check uniqueness and Strict Length
                let s = val.toString().replace('.', ',');
                if (s.length <= 6 && !sortNumbers.some(n => n.val === val)) {
                    sortNumbers.push({
                        id: sortNumbers.length,
                        val: val,
                        str: s
                    });
                }
            }
            
            // If generation failed (rare), fallback
            if (sortNumbers.length < 4) {
                 // Simple fill
                 while(sortNumbers.length < 4) {
                     let v = sortNumbers.length + 1.1;
                     sortNumbers.push({id: sortNumbers.length, val: v, str: v.toString().replace('.', ',')});
                 }
            }

            renderSortPool();
        }

        function renderSortPool() {
            const pool = document.getElementById('sortPool');
            pool.innerHTML = '';

            sortNumbers.forEach(num => {
                const isInSlot = slotsContent.some(s => s && s.id === num.id);
                if (!isInSlot) {
                    const btn = document.createElement('div');
                    btn.className = "sort-card bg-slate-700 border border-slate-500 rounded-xl p-3 text-center text-lg md:text-xl font-bold text-white shadow-lg flex items-center justify-center";
                    btn.textContent = num.str;
                    btn.onclick = () => moveToSlot(num);
                    pool.appendChild(btn);
                }
            });
        }

        function moveToSlot(numObj) {
            if (isSolved) return;

            const emptyIndex = slotsContent.findIndex(x => x === null);
            if (emptyIndex !== -1) {
                slotsContent[emptyIndex] = numObj;
                
                const slotEl = document.getElementById(`slot${emptyIndex}`);
                slotEl.innerHTML = `<span class="text-lg md:text-2xl font-bold text-white drop-shadow-md slot-card">${numObj.str}</span>`;
                slotEl.classList.remove('border-dashed', 'text-slate-600');
                slotEl.classList.add('border-solid', 'border-cyan-400', 'bg-cyan-900/30');

                renderSortPool();
                checkSortAuto();
            }
        }

        function returnToPool(slotIndex) {
            if (isSolved) return;
            if (slotsContent[slotIndex] === null) return;

            slotsContent[slotIndex] = null;
            
            const slotEl = document.getElementById(`slot${slotIndex}`);
            slotEl.innerHTML = '';
            slotEl.className = "w-full aspect-square md:aspect-[4/3] bg-slate-800/50 border-2 border-dashed border-slate-600 rounded-xl flex items-center justify-center text-slate-600 text-lg md:text-2xl font-bold hover:bg-slate-800 transition-colors cursor-pointer";

            renderSortPool();
            document.getElementById('feedbackArea').innerHTML = '<span class="text-slate-500">...</span>';
        }

        function checkSortAuto() {
            if (slotsContent.some(x => x === null)) return;

            let isCorrect = true;
            for(let i = 0; i < 3; i++) {
                const a = slotsContent[i].val;
                const b = slotsContent[i+1].val;
                
                if (sortDirection === 'asc') {
                    if (a > b) isCorrect = false;
                } else {
                    if (a < b) isCorrect = false;
                }
            }

            const feedback = document.getElementById('feedbackArea');
            if (isCorrect) {
                feedback.innerHTML = `<span class="text-green-400 drop-shadow-lg">Perfekte Ordnung! 🚀</span>`;
                isSolved = true;
                slotsContent.forEach((_, i) => {
                    document.getElementById(`slot${i}`).classList.add('border-green-500', 'bg-green-500/20');
                });
            } else {
                feedback.innerHTML = `<span class="text-red-400 drop-shadow-lg">Reihenfolge stimmt nicht!</span>`;
                slotsContent.forEach((_, i) => {
                     document.getElementById(`slot${i}`).classList.add('border-red-500');
                });
                setTimeout(() => {
                    slotsContent.forEach((_, i) => {
                         document.getElementById(`slot${i}`).classList.remove('border-red-500');
                    });
                }, 1000);
            }
        }

        // --- SHARED FUNCTIONS ---

        function showSolution() {
            if (currentMode === 'compare') {
                let correctOp = '';
                if (compA.val < compB.val) correctOp = '<';
                else if (compA.val > compB.val) correctOp = '>';
                else correctOp = '=';
                resetBtnStyles();
                highlightButton(correctOp, 'bg-yellow-500', 'border-yellow-400');
                document.getElementById('feedbackArea').innerHTML = `<span class="text-yellow-400">Hier ist die Lösung!</span>`;
                isSolved = true;
            } else {
                const sorted = [...sortNumbers].sort((a,b) => sortDirection === 'asc' ? a.val - b.val : b.val - a.val);
                
                sorted.forEach((item, idx) => {
                    const slotEl = document.getElementById(`slot${idx}`);
                    slotEl.innerHTML = `<span class="text-lg md:text-2xl font-bold text-yellow-300 drop-shadow-md">${item.str}</span>`;
                    slotEl.className = "w-full aspect-square md:aspect-[4/3] bg-yellow-900/30 border-2 border-solid border-yellow-500 rounded-xl flex items-center justify-center";
                });
                
                document.getElementById('sortPool').innerHTML = '';
                slotsContent = sorted; 
                isSolved = true;
                document.getElementById('feedbackArea').innerHTML = `<span class="text-yellow-400">Das ist die richtige Reihenfolge!</span>`;
            }
        }

        // Init
        generateTask();

    </script>
</body>
</html>
